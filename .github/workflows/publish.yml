# Every push to main is a release: bump patch (unless the version is already unpublished), rebuild dist, tag, publish.
# Auth: NPM_TOKEN repo secret (granular token, publish scope, bypass 2FA), or npm trusted publishing via OIDC if configured.
name: publish
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Bump version if this one is already on npm
        run: |
          name=$(node -p 'require("./package.json").name')
          local=$(node -p 'require("./package.json").version')
          published=$(npm view "$name" version 2>/dev/null || echo none)
          if [ "$local" = "$published" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version patch -m "v%s [skip ci]"
            git push --follow-tags
          else
            echo "package.json is already at unpublished $local; publishing as is"
            npm run build
          fi
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
