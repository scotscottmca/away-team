# A push to main that changes shipped code is a release: bump patch (unless the version is already unpublished),
# rebuild dist, tag, publish. Docs, workflow and licence changes do not release.
# Auth: NPM_TOKEN repo secret (granular token, publish scope, bypass 2FA), or npm trusted publishing via OIDC if configured.
name: publish
on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'skills/**'
      - 'bin/**'
      - 'hooks/**'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # The installer needs its dependencies: npm test spawns it to check what an install writes.
      - run: npm ci
      - name: Bump version if this one is already tagged
        # Tags are the source of truth: the registry's read cache can lag a publish by minutes.
        run: |
          git fetch --tags --force --quiet origin
          local=$(node -p 'require("./package.json").version')
          if git rev-parse -q --verify "refs/tags/v$local" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version patch -m "v%s [skip ci]"
            git push --follow-tags
          else
            echo "v$local is not tagged yet; publishing as is"
            npm run build
          fi
      # Rebuilds dist/ and asserts over it: a broken render must not reach npm.
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
