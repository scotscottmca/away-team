# A push to main that changes shipped code is a release: bump patch (unless the version is already unpublished),
# rebuild dist, tag, publish. Docs, workflow and licence changes do not release.
# Auth: npm trusted publishing via OIDC (id-token: write below). No token secret; the trusted publisher is
# configured on npmjs.com for this repo and publish.yml.
name: publish
on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'skills/**'
      - 'bin/**'
      - 'hooks/**'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
# Never cancel a release in flight: it bumps, tags and pushes before it publishes.
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # The installer needs its dependencies: npm test spawns it to check what an install writes.
      - run: npm ci
      # Validate BEFORE anything is pushed. The bump below commits and pushes a tag to main, so a test
      # that only ran after it would leave main carrying a release commit and a tag for a version that
      # was never published — and the next run would bump past it, skipping that version for good.
      - run: npm test
      - name: Bump version if this one is already tagged
        # Tags are the source of truth: the registry's read cache can lag a publish by minutes.
        run: |
          git fetch --tags --force --quiet origin
          local=$(node -p 'require("./package.json").version')
          if git rev-parse -q --verify "refs/tags/v$local" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version patch -m "v%s [skip ci]"
            git push --follow-tags
          else
            echo "v$local is not tagged yet; publishing as is"
            npm run build
          fi
      # Again, on the bumped tree: the first run validated the source, this one validates the exact
      # render that is about to be published.
      - run: npm test
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm publish --access public
