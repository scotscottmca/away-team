# Runs the build-output test on every pull request, so a broken render is caught before it is merged
# rather than when it blocks a publish. publish.yml keeps its own test step: that one gates npm publish.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A newer push supersedes this run; nothing here has a side effect worth finishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor package.json declares, plus the newer lines. 20.19 is where require(esm) landed,
        # which the ESM-only @clack/prompts needs; 18 and 20.0 fail outright, checked on both.
        node: ['20.19.0', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The install tests run bin/away-team.js, which needs @clack/prompts and picocolors.
      - run: npm ci
      # Rebuilds dist/ and asserts over it, including that dist/ matches what is committed.
      - run: npm test

  # Once, not once per matrix leg. High and critical only: a moderate advisory with no fix available
  # must not block an unrelated pull request, and Dependabot raises the routine bumps weekly.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm audit --audit-level=high
